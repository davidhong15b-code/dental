# MEASURED workcell configuration. No invented physical coordinates.
# Do not set calibrated=true before measuring these values on the actual workcell.
calibrated: false
planning_frame: base_link
# All XYZ values metres, orientations XYZW quaternions. Do not enter CAD millimetres.
table:
  center_xyz_m: null
  size_xyz_m: null
jaw:
  collision_center_xyz_m: null
  collision_size_xyz_m: null
  # Optional visual CAD overlay from repo docs/Jaw_model.stl. Its origin/units
  # must be checked independently of collision-box dimensions.
  visual_stl: docs/Jaw_model.stl
  visual_position_xyz_m: null
  visual_quaternion_xyzw: null
  visual_scale: null
brush:
  # Tool0 to conservative collision-box centre, MEASURED while brush is mounted.
  center_tool0_xyz_m: null
  size_xyz_m: null
  # Optional passive brush STL overlay, dimensions and origin must be verified.
  visual_stl: docs/EE_4_Brush_tool.stl
  visual_position_tool0_xyz_m: null
  visual_quaternion_xyzw: null
  visual_scale: null
